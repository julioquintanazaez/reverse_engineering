name: Deploy Files via FTPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.SERVER_IP_REVERSE }}       
          username: ${{ secrets.SERVER_USER_REVERSE }}   # Secret para usuario 
          password: ${{ secrets.SERVER_PASSWORD_REVERSE  }}   # Secret para contraseña 
          protocol: ftps                         # ¡Clave para FTPS!
          port: 21                               # Puerto FTPS (generalmente 21 o 990)
          local-dir: ./
          server-dir: ${{ secrets.DEPLOY_PATH_REVERSE }}

              

     
    
          
      
      
  

      
