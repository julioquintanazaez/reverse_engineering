name: Deploy Application

on:
  push:
    branches:
      - main  # Cambia esto según tu rama principal

jobs:
  deploy:  #Funciona
    runs-on: ubuntu-latest  #Funciona

    steps:    #Funciona
      - name: Checkout code        #Funciona
        uses: actions/checkout@v2  #Funciona

      - name: Configurar Python   
        uses: actions/setup-python@v2   
        with:
          python-version: '3.11'  
  
      - name: Set up SSH    #Funciona
        uses: webfactory/ssh-agent@v0.5.3   #Funciona
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_REVERSE_PUTTY }}  #Funciona

      - name: Instalar dependencias
        run: |  
            python -m pip install --upgrade pip  
            pip install -r requirements.txt  # Asegúrate de tener este archivo en tu proyecto

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@98.85.52.74 "cd /var/www/apireverseengenieringhaplotype.pgxsoftware.com"
    
    

     