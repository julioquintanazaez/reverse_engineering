name: Deploy Files via FTPS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          python-version: '3.11'  

      - name: Instalar dependencias
        run: |  
          python3 -m pip install --upgrade pip            
  
      

              

     
    
          
      
      
  

      
