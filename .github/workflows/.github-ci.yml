name: Deploy Application

on:
  push:
    branches:
      - main  # Cambia esto según tu rama principal

jobs:
  deploy:  #Funciona
    runs-on: ubuntu-latest  #Funciona

    steps:    #Funciona
      - name: Checkout code        #Funciona
        uses: actions/checkout@v2  #Funciona

      - name: Configurar Python   
        uses: actions/setup-python@v2   
        with:
          python-version: '3.11'  

      - name: Instalar dependencias
        run: |  
          python -m pip install --upgrade pip            
  
      - name: Set up SSH
        run: |
            mkdir -p ~/.ssh
            echo "${{ secrets.SSH_PRIVATE_KEY_REVERSE_PUTTY }}" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H ${{ secrets.SERVER_IP_REVERSE }} >> ~/.ssh/known_hosts
            
      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER_REVERSE }}@${{ secrets.SERVER_IP_REVERSE }} "echo 'SSH connection successful!'"
      
      - name: Copy files to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_REVERSE_PUTTY }}
          SERVER_USER: ${{ secrets.SERVER_USER_REVERSE }}
          SERVER_IP: ${{ secrets.SERVER_IP_REVERSE }}
        run: |
          # Configura la clave SSH
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          # Copia los archivos al servidor
          scp -i private_key -r ./* ${{ secrets.SERVER_USER_REVERSE }}@${{ secrets.SERVER_IP_REVERSE }}:${{ secrets.DEPLOY_PATH_REVERSE }}

      #- name: Install dependencies
      #  run: |
      #      python -m venv venv  # Crear un entorno virtual
      #      source venv/bin/activate  # Activar el entorno virtual
      #      pip install -r requirements.txt  # Instalar dependencias desde requirements.txt

      - name: Install dependencies on remote server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_REVERSE_PUTTY }}
          SERVER_USER: ${{ secrets.SERVER_USER_REVERSE }}
          SERVER_IP: ${{ secrets.SERVER_IP_REVERSE }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key
          chmod 600 private_key
          ssh -i private_key ${{ secrets.SERVER_USER_REVERSE }}@${{ secrets.SERVER_IP_REVERSE }} 'source ${{ secrets.DEPLOY_PATH_REVERSE }}/venv/bin/activate && pip install -r ${{ secrets.DEPLOY_PATH_REVERSE }}/requirements.txt'

      #- name: Run Django server on remote server
      #  env:
      #      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY_REVERSE_PUTTY }}  # Clave privada
      #      SERVER_USER: ${{ secrets.SERVER_USER_REVERSE }}  # Usuario del servidor
      #      SERVER_IP: ${{ secrets.SERVER_IP_REVERSE }}  # IP del servidor
      #  run: |
      #      echo "$SSH_PRIVATE_KEY" > private_key  # Guardar la clave privada en un archivo
      #      chmod 600 private_key  # Cambiar permisos de la clave
      #      ssh -i private_key ${{ secrets.SERVER_USER_REVERSE }}@${{ secrets.SERVER_IP_REVERSE }} 'source ${{ secrets.DEPLOY_PATH_REVERSE }}/venv/bin/activate 

     
      - name: Echo hello world
        run: echo "${{ secrets.DEPLOY_PATH_REVERSE }}"
  

      