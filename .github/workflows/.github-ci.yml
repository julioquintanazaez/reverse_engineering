name: Deploy Files via FTP (TCP/21)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files via FTP (TCP)
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.SERVER_IP_REVERSE }}      # Ejemplo: ftp.miservidor.com
          username: ${{ secrets.SERVER_USER_REVERSE }}   # Usuario FTP
          password: ${{ secrets.SERVER_PASSWORD_REVERSE }} # Contraseña FTP
          local-dir: ./                                # Directorio local
          server-dir: ${{ secrets.DEPLOY_PATH_REVERSE }} # Ruta remota (ej: /var/www/)
