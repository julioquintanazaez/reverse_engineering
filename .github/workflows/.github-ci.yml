name: Conectar a Contabo y Activar Entorno Virtual

on:
  push:
    branches:
      - main # o la rama que desees

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Conectar a Contabo vía SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP_REVERSE }}
          username: ${{ secrets.SERVER_USER_REVERSE }}
          password: ${{ secrets.SERVER_USER_REVERSE }}
          script: |
            # Activar entorno virtual
            source /var/www/apireverseengenieringhaplotype.pgxsoftware.com/venv/bin/activate
            # Puedes agregar más comandos aquí si es necesario
            # Por ejemplo, para verificar la versión de Python en el entorno virtual
            # python --version


