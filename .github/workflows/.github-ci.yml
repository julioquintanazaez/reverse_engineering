name: Deploy Application

on:
  push:
    branches:
      - main  # Cambia esto según tu rama principal

jobs:
  deploy:  #Funciona
    runs-on: ubuntu-latest  #Funciona

    steps:    #Funciona
      - name: Checkout code        #Funciona
        uses: actions/checkout@v2  #Funciona

      - name: Configurar Python   
        uses: actions/setup-python@v2   
        with:
          python-version: '3.11'  

      - name: Instalar dependencias
        run: |  
          python -m pip install --upgrade pip            
  
      - name: Set up SSH    #Funciona
        uses: webfactory/ssh-agent@v0.5.3   #Funciona
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_REVERSE_PUTTY }}  #Funciona
            
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_REVERSE_PUTTY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP_REVERSE }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: | 
          scp -r ./* ${{ secrets.SERVER_USER_REVERSE }}@${{ secrets.SERVER_IP_REVERSE }}:${{ secrets.DEPLOY_PATH_REVERSE }}

      #- name: Install dependencies
      #  run: | 
      #    ssh ${{ secrets.SERVER_USER_REVERSE }}@${{ secrets.SERVER_IP_REVERSE }} 'cd ${{ secrets.DEPLOY_PATH_REVERSE }} && pip install -r requirements.txt'

      - name: Echo hello world
        run: echo "${{ secrets.DEPLOY_PATH_REVERSE }}"
  

      