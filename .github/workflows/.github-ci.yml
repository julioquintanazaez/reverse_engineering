name: Deploy Application

on:
  push:
    branches:
      - main  # Cambia esto según tu rama principal

jobs:
  deploy:  # Funciona
    runs-on: ubuntu-latest  # Funciona

    steps:    # Funciona
      - name: Checkout code        # Funciona
        uses: actions/checkout@v2  # Funciona

      - name: Configurar Python   
        uses: actions/setup-python@v2   
        with:
          python-version: '3.11'  

      - name: Instalar dependencias
        run: |  
          python3 -m pip install --upgrade pip            

      - name: Copy files to server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER_REVERSE }}
          SERVER_IP: ${{ secrets.SERVER_IP_REVERSE }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD_REVERSE }}  # Almacena la contraseña en los secretos
        run: |
          # Copia los archivos al servidor usando la contraseña
          echo "${{ secrets.SERVER_PASSWORD_REVERSE }}" | sshpass -p "$SERVER_PASSWORD" scp -o StrictHostKeyChecking=no -r ./* $SERVER_USER@$SERVER_IP:${{ secrets.DEPLOY_PATH_REVERSE }}
  
      - name: Setup Django server on remote server
        env:
          SERVER_USER: ${{ secrets.SERVER_USER_REVERSE }}
          SERVER_IP: ${{ secrets.SERVER_IP_REVERSE }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD_REVERSE }}  # Almacena la contraseña en los secretos
        run: |
          # Ejecuta comandos en el servidor remoto usando la contraseña
          echo "${{ secrets.SERVER_PASSWORD_REVERSE }}" | sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP << 'EOF'
              which python3 || { echo "Python no está instalado"; exit 1; }
              python3 -m venv venv  # Crear un entorno virtual
              source ${{ secrets.DEPLOY_PATH_REVERSE }}/venv/bin/activate || { echo "No se pudo activar el entorno virtual"; exit 1; }
              pip install -r ${{ secrets.DEPLOY_PATH_REVERSE }}/requirements.txt  
              cd ${{ secrets.DEPLOY_PATH_REVERSE }}   
              python manage.py makemigrations  
              python manage.py migrate
          EOF

      - name: Restart service
        run: |
            echo "${{ secrets.SERVER_PASSWORD_REVERSE }}" | sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER_REVERSE }}@${{ secrets.SERVER_IP_REVERSE }} << 'EOF'
              sudo systemctl restart apireverseengeneering.service
            EOF
         


              

     
    
          
      
      
  

      
