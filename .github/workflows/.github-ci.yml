name: Despliegue de Proyecto Python

on:
  push:
    branches:
      - main # o la rama que desees

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Restart service
        run: |
            source ${{ secrets.DEPLOY_PATH_REVERSE }}/venv/bin/activate || { echo "No se pudo activar el entorno virtual"; exit 1; }
            cd ${{ secrets.DEPLOY_PATH_REVERSE }} 
