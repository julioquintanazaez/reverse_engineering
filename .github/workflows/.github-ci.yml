name: Deploy Application

on:
  push:
    branches:
      - main  # Cambia esto según tu rama principal

jobs:
  deploy:  #Funciona
    runs-on: ubuntu-latest  #Funciona

    steps:    #Funciona
      - name: Checkout code        #Funciona
        uses: actions/checkout@v2  #Funciona

      - name: Configurar Python   
        uses: actions/setup-python@v2   
        with:
          python-version: '3.11'  
  
      - name: Set up SSH    #Funciona
        uses: webfactory/ssh-agent@v0.5.3   #Funciona
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_REVERSE_PUTTY }}  #Funciona

      - name: Instalar dependencias
        run: |  
            python -m pip install --upgrade pip  
            pip install -r requirements.txt  # Asegúrate de tener este archivo en tu proyecto

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER_REVERSE }}@${{ secrets.SERVER_IP_REVERSE }} "cd ${{ secrets.DEPLOY_PATH_REVERSE }} && exit"
    
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_REVERSE_PUTTY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP_REVERSE }} >> ~/.ssh/known_hosts

      
      - name: Clonar un repositorio de GitHub en el servidor
        hosts: all
        gather_facts: no
        tasks:
        - name: Clonar el repositorio de GitHub
          git: 
            repo: 'git@github.com:julioquintanazaez/reverse_engineering.git'  # Reemplaza con la URL de tu repositorio
            dest: '/var/www/apireverseengenieringhaplotype.pgxsoftware.com'  # Reemplaza con la ruta donde deseas clonar el repositorio
            version: 'main'  # Reemplaza con la rama que deseas clonar
          become: yes  # Si necesitas permisos de superusuario
