name: Deploy to Contabo

on:
  push:
    branches:
      - main  # Ajusta esto según tu rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Copy files to Contabo server via FTP
        env:
          FTP_USER: ${{ secrets.SERVER_USER_REVERSE }}  # Usuario del servidor FTP
          FTP_PASSWORD: ${{ secrets.SERVER_PASSWORD_REVERSE }}  # Contraseña del servidor FTP
          FTP_SERVER: ${{ secrets.SERVER_IP_REVERSE }}  # Dirección del servidor FTP
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_REVERSE }}  # Ruta de destino en el servidor
          FTP_PORT: "21" 
        run: |
          curl -T ./ ftp://$FTP_USER:$FTP_PASSWORD@$FTP_SERVER:$FTP_PORT$DEPLOY_PATH --ftp-create-dirs

      

              

     
    
          
      
      
  

      
