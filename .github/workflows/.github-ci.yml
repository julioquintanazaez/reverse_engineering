name: Deploy Reverse project to Contabo 

on:
  push:
    branches: [ main ]  # Cambia por tu rama principal si es diferente

jobs:
  deploy:
     runs-on: ubuntu-latest
     env:  # Variables de entorno globales (para todos los steps)
      REMOTE_DIR: ${{ secrets.DEPLOY_PATH_REVERSE || '/var/www/' }}
      SSH_HOST: ${{ secrets.SERVER_IP_REVERSE }}
      SSH_USER: ${{ secrets.SERVER_USER_REVERSE }}
      SSH_PASSWORD: ${{ secrets.SERVER_PASSWORD_REVERSE }}

     steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Install SSHpass (para conexión con contraseña)
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Upload files via SCP
        run: |
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no -r ./* "$SSH_USER@$SSH_HOST:$REMOTE_DIR"

      - name: Install requirements and run django server
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" "
            cd $REMOTE_DIR
            # Comandos adicionales si necesitas:
            source venv/bin/activate  # Si usas virtualenv
            pip install -r requirements.txt
            python manage.py runserver
            echo 'Instalación de requirements y levantar servidor'
          "

      

  
