name: Deploy Files via FTP

on:
  push:
    branches: [ main ]  # Trigger al hacer push a main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.SERVER_IP_REVERSE }}       # Ej: ftp.ejemplo.com
          username: ${{ secrets.SERVER_USER_REVERSE }}   # Secret para usuario FTP
          password: ${{ secrets.SERVER_PASSWORD_REVERSE  }}   # Secret para contraseña FTP
          local-dir: ./                           # Directorio local (repo completo)
          server-dir: ${{ secrets.DEPLOY_PATH_REVERSE }} # Secret para ruta remota (ej: /var/www/app/)


              

     
    
          
      
      
  

      
